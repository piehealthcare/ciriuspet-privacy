<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy · CIRIUS PET (Toasty Time)</title>
<style>
  :root { --brick:#B33000; --orange:#E83800; --beige:#F0E8D8; --ink:#3A2A20; --muted:#8A7A6A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; background:var(--beige); color:var(--ink); line-height:1.75; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 24px 80px; }
  h1 { color:var(--brick); font-size:26px; margin-bottom:4px; }
  .updated { color:var(--muted); font-size:13px; font-weight:700; margin-bottom:8px; }
  .langsel { margin:18px 0 28px; }
  .langsel button { border:2px solid var(--orange); background:#fff; color:var(--orange); font-weight:800; padding:6px 16px; border-radius:16px; cursor:pointer; margin-right:8px; font-size:14px; }
  .langsel button.on { background:var(--orange); color:#fff; }
  h2 { color:var(--brick); font-size:17px; margin:26px 0 6px; }
  p { font-size:15px; white-space:pre-line; }
  .card { background:#fff; border-radius:20px; padding:28px; box-shadow:0 2px 10px rgba(60,20,10,.06); }
  footer { text-align:center; color:var(--muted); font-size:12.5px; margin-top:36px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="t-title">개인정보처리방침</h1>
  <div class="updated" id="t-updated">시행일 · 2026년 7월 5일</div>
  <div class="langsel">
    <button id="b-ko" class="on" onclick="setLang('ko')">한국어</button>
    <button id="b-en" onclick="setLang('en')">English</button>
  </div>
  <div class="card" id="content"></div>
  <footer>CIRIUS PET · Pie Healthcare Co., Ltd. · ceo@piehealthcare.kr</footer>
</div>
<script>
const DATA = {
  ko: {
    title:'개인정보처리방침', updated:'시행일 · 2026년 7월 5일',
    intro:'주식회사 파이헬스케어(이하 "회사")는 따땃타임 앱(이하 "서비스") 이용자의 개인정보를 소중히 다루며, 관련 법령을 준수합니다.',
    secs:[
      ['1. 수집하는 정보','따땃타임은 서비스 제공에 꼭 필요한 최소한의 정보만 다룹니다.\n\n· 반려동물 정보: 아이 이름, 견종, 생일·입양일(선택)\n· 케어 기록: 따땃 세션 기록(날짜·시간), 컨디션 메모, 케어 루틴, 스티커·리포트 등 파생 기록\n· 프로필(선택): 닉네임 — 루틴 공개·랭킹 기능을 쓸 때만 만들어요\n· 보호자의 이름, 연락처, 위치 정보는 수집하지 않습니다.'],
      ['2. 사진은 이 기기에만','따땃타임에서 찍거나 고른 착용샷 사진은 사용자의 기기에만 저장됩니다. 서버로 업로드하거나 외부로 전송하지 않으며, 회사는 사진에 접근할 수 없습니다.'],
      ['3. 저장과 백업','모든 기록은 기본적으로 사용자의 기기 안에 저장됩니다.\n\n로그인(소셜 계정)을 하면 케어 루틴, 주간 따땃지수, 세션 기록(사진 제외)이 Google Firebase(Authentication·Cloud Firestore)에 백업됩니다. Firebase 는 Google LLC 가 제공하는 클라우드 서비스로, 데이터는 암호화된 통신으로 전송·보관됩니다.'],
      ['4. 이용 목적','· 케어 기록·일지·리포트 등 앱 기능 제공\n· 로그인 시 기기 변경·재설치에 대비한 기록 백업\n· 루틴 공개·주간 랭킹 등 커뮤니티 기능(닉네임만 표시)\n\n수집한 정보를 광고 목적으로 제3자에게 제공하지 않습니다.'],
      ['5. 보관 기간과 삭제','기록은 사용자가 삭제하거나 계정을 삭제할 때까지 보관됩니다.\n\n· 앱 안에서 삭제: 설정 → 데이터 관리 → "모든 기록 삭제"로 기기 안의 모든 기록을 즉시 지울 수 있어요.\n· 계정 삭제: 로그인 상태라면 설정 → 데이터 관리 → "계정 삭제"로 서버에 백업된 정보(프로필·루틴·지수·세션 백업)와 계정이 함께 삭제됩니다.\n· 앱을 삭제하면 기기에 저장된 기록도 함께 삭제됩니다.'],
      ['6. 이용자의 권리','사용자는 언제든 자신의 정보 열람·정정·삭제를 요청할 수 있습니다. 앱 안의 삭제 기능을 이용하거나 아래 문의처로 연락해 주세요.'],
      ['7. 문의처','주식회사 파이헬스케어 (CIRIUS PET · 따땃타임)\n이메일: ceo@piehealthcare.kr\n\n개인정보 관련 문의는 접수 후 지체 없이 답변드립니다.'],
      ['8. 방침의 변경','이 방침이 바뀌면 앱 내 공지 또는 업데이트 안내로 알려드립니다.'],
    ],
  },
  en: {
    title:'Privacy Policy', updated:'Effective · July 5, 2026',
    intro:'Pie Healthcare Co., Ltd. ("the company") treats the personal information of Toasty Time app ("the service") users with care and complies with applicable laws.',
    secs:[
      ['1. Information We Collect',"Toasty Time only handles the minimum information needed to provide the service.\n\n· Pet info: your buddy's name, breed, birthday/adoption day (optional)\n· Care records: Toasty session logs (date & time), condition memos, care routines, and derived records such as stickers and reports\n· Profile (optional): a nickname — created only if you use routine sharing or rankings\n· We do not collect the pet parent's name, contact details, or location."],
      ['2. Photos Stay on This Device','Photos taken or chosen in Toasty Time are stored only on your device. They are never uploaded to a server or sent externally, and the company cannot access them.'],
      ['3. Storage and Backup','By default, all records are stored on your device.\n\nIf you sign in (with a social account), your care routines, weekly Toasty Meter, and session records (photos excluded) are backed up to Google Firebase (Authentication & Cloud Firestore). Firebase is a cloud service provided by Google LLC, and data is transmitted and stored over encrypted connections.'],
      ['4. How We Use It','· Providing app features such as care records, the diary, and reports\n· Backing up records against device changes or reinstalls when signed in\n· Community features such as routine sharing and weekly rankings (only your nickname is shown)\n\nWe do not provide collected information to third parties for advertising.'],
      ['5. Retention and Deletion','Records are kept until you delete them or delete your account.\n\n· In-app deletion: Settings → Data → "Delete all records" immediately erases every record on your device.\n· Account deletion: while signed in, Settings → Data → "Delete account" removes the server backups (profile, routines, scores, session backups) together with your account.\n· Deleting the app also deletes the records stored on your device.'],
      ['6. Your Rights','You may request access to, correction of, or deletion of your information at any time. Use the in-app deletion features or contact us below.'],
      ['7. Contact','Pie Healthcare Co., Ltd. (CIRIUS PET · Toasty Time)\nEmail: ceo@piehealthcare.kr\n\nPrivacy inquiries are answered without delay after they are received.'],
      ['8. Changes to This Policy','If this policy changes, we will let you know via an in-app notice or update note.'],
    ],
  },
};
function setLang(l){
  const d=DATA[l];
  document.documentElement.lang=l;
  document.getElementById('t-title').textContent=d.title;
  document.getElementById('t-updated').textContent=d.updated;
  document.getElementById('b-ko').className=l==='ko'?'on':'';
  document.getElementById('b-en').className=l==='en'?'on':'';
  const c=document.getElementById('content');
  c.innerHTML='';
  const ip=document.createElement('p'); ip.textContent=d.intro; c.appendChild(ip);
  for(const [h,b] of d.secs){
    const hh=document.createElement('h2'); hh.textContent=h; c.appendChild(hh);
    const pp=document.createElement('p'); pp.textContent=b; c.appendChild(pp);
  }
}
setLang((navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en');
</script>
</body>
</html>
